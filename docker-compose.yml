services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
    container_name: cosmos-emulator
    ports:
      - "8081:8081"
      - "10251-10255:10251-10255"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 3
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: true
      # Bind the TLS cert to 127.0.0.1 so localhost connections work from the host.
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: 127.0.0.1
    mem_limit: 3g
    volumes:
      # Persists the emulator data and TLS cert across container restarts.
      - cosmos-emulator-data:/tmp/cosmos/appdata

volumes:
  cosmos-emulator-data:
